["build:cli"]
description = "Build the standalone Windows x64 CLI scaffolding preview"
run = "node tools/build-cli.mjs"

["test:cli"]
description = "Verify the compiled CLI without a checkout or tools on PATH"
run = ["node tools/build-cli.mjs", "node tools/verify-cli.mjs", "node tools/build-sdk-release.mjs", "node --test tools/cli/sdk-bundle.test.mjs tools/release-config.test.mjs"]

["build:sdk-release"]
description = "Package a versioned SDK for a GitHub release"
run = "node tools/build-sdk-release.mjs"

["package:release"]
description = "Package tested CLI or SDK assets for BYTORIO_RELEASE_TAG"
run = ["node tools/package-release.mjs", "node tools/publish-release.mjs --check"]
