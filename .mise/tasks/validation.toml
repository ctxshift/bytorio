# Reuse only compiled harnesses. Every verifier still runs all tests and replays.
["deps:trace:resources"]
sources = ["runtime/odin/**/*", "sdk/odin/**/*", "tests/**/*.odin", "tools/build-trace.mjs", "tools/toolchain.mjs", "tools/command-timing.mjs", "mise.toml", ".mise/tasks/*.toml"]
outputs = ["build/validation-tools/resources/trace.exe"]
run = "node tools/build-trace.mjs resources"

["deps:trace:graphics"]
sources = ["runtime/odin/**/*", "sdk/odin/**/*", "tests/**/*.odin", "tools/build-trace.mjs", "tools/toolchain.mjs", "tools/command-timing.mjs", "mise.toml", ".mise/tasks/*.toml"]
outputs = ["build/validation-tools/graphics/trace.exe"]
run = "node tools/build-trace.mjs graphics"

["deps:trace:audio"]
sources = ["runtime/odin/**/*", "sdk/odin/**/*", "tests/**/*.odin", "tools/build-trace.mjs", "tools/toolchain.mjs", "tools/command-timing.mjs", "mise.toml", ".mise/tasks/*.toml"]
outputs = ["build/validation-tools/audio/trace.exe"]
run = "node tools/build-trace.mjs audio"
