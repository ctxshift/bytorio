<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Console player — Odin</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #10131e;
        color: #dfeae7;
      }
      main {
        text-align: center;
        padding: 16px;
      }
      canvas {
        display: block;
        margin: auto;
        background: #141828;
        image-rendering: pixelated;
        touch-action: none;
        outline: none;
      }
      button {
        margin: 20px 0 8px;
        padding: 12px 24px;
        border: 0;
        border-radius: 6px;
        background: #70f0c0;
        color: #10131e;
        font: inherit;
        cursor: pointer;
      }
      #screen:fullscreen {
        display: grid;
        place-items: center;
        background: #000;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        max-width: 700px;
        min-height: 1.5em;
        color: #b2bfcc;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="screen">
        <canvas
          id="canvas"
          width="640"
          height="360"
          tabindex="0"
          aria-label="Game display"
        ></canvas>
      </div>
      <button id="start" disabled>Start game</button>
      <button id="fullscreen">Fullscreen</button>
      <label>Open cartridge <input id="cartridge" type="file" accept=".png,image/png" /></label>
      <fieldset>
        <legend>Graphics settings (applying restarts the game)</legend>
        <label
          >Renderer
          <select id="graphics-backend">
            <option value="cpu">CPU reference</option>
            <option value="gpu">GPU 3D + CPU 2D</option>
            <option value="auto">Auto</option>
          </select></label
        >
        <label
          >Supersampling
          <select id="graphics-ssaa">
            <option value="off">Off</option>
            <option value="2x">2× per axis</option>
            <option value="1080p">Up to 1080p</option>
          </select></label
        >
        <label><input id="graphics-snap" type="checkbox" /> Snap orthographic camera</label>
        <label><input id="graphics-smooth" type="checkbox" /> Smooth pan presentation</label>
        <button id="graphics-apply">Apply graphics settings</button>
        <p id="graphics-status" role="status"></p>
      </fieldset>
      <p id="status" role="status">Loading Odin player…</p>
    </main>
    <script type="module" src="./player.js"></script>
  </body>
</html>
