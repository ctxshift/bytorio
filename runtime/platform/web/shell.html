<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Console player</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #10131e; color: #e4eceb; display: grid; place-items: center; }
    main { width: min(92vw, 1152px); text-align: center; }
    canvas { width: 100%; aspect-ratio: 16/9; display: block; background: #141828; image-rendering: pixelated; outline: none; }
    button { margin: 24px 0 8px; padding: 12px 24px; border: 0; border-radius: 6px; background: #70f0c0; color: #10131e; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { min-height: 1.5em; color: #b2bfcc; }
  </style>
</head>
<body>
<main>
  <canvas id="canvas" width="1152" height="648" tabindex="0" aria-label="Game display"></canvas>
  <button id="start" disabled>Start game</button>
  <p id="status" role="status">Loading player…</p>
</main>
<script>
  const canvas = document.getElementById('canvas');
  globalThis.playerStatus = { ready: false, error: '' };
  globalThis.playerAudio = {
    context: null, buffer: null, source: null, played: 0, ended: 0, peak: 0,
    play(samples) {
      if (!this.context || this.context.state !== 'running') return;
      if (!this.buffer) {
        this.buffer = this.context.createBuffer(1, samples.length, 48000);
        this.buffer.copyToChannel(samples, 0);
        for (const value of samples) this.peak = Math.max(this.peak, Math.abs(value));
      }
      if (this.source) { this.source.onended = null; this.source.stop(); }
      const source = this.context.createBufferSource();
      source.buffer = this.buffer;
      source.connect(this.context.destination);
      source.onended = () => { this.ended++; if (this.source === source) this.source = null; };
      source.start();
      this.source = source;
      this.played++;
    },
  };
  var Module = {
    canvas,
    arguments: new URLSearchParams(location.search).has('replay') ? ['--manual'] : new URLSearchParams(location.search).has('smoke') ? ['--smoke'] : [],
    onAbort(reason) {
      globalThis.playerStatus = { ready: false, error: String(reason) };
      document.getElementById('status').textContent = String(reason);
    },
    printErr(text) { console.error(text); },
  };
  document.getElementById('start').addEventListener('click', async () => {
    try {
      const audio = globalThis.playerAudio;
      if (!audio.context) audio.context = new AudioContext();
      await audio.context.resume();
      if (audio.context.state !== 'running') throw new Error('Audio could not start; click Start game again.');
      Module._player_start();
      document.getElementById('start').textContent = 'Resume game';
      canvas.focus();
    } catch (error) {
      document.getElementById('status').textContent = error.message;
    }
  });
  canvas.addEventListener('pointerdown', () => canvas.focus());
  window.addEventListener('keydown', event => {
    if (document.activeElement === canvas && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) event.preventDefault();
  });
</script>

</html>
