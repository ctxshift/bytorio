name: Build and verify players

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run format:js:check

  sdk:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    env:
      PLAYER_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.15
      - run: npm ci
      - name: Lint and type check all project languages
        run: mise run lint
      - name: Check formatting in all project languages
        run: mise run format:check
      - name: Check generated constants
        run: mise run generate:check
      - name: Verify SDKs, cartridges, resources, graphics and game replays
        run: mise run test
      - name: Verify drawing batches
        run: node experiments/luau-executor/verify-drawing.mjs
      - name: Verify executor cache
        run: node experiments/luau-executor/verify-cache.mjs
      - name: Ensure asset rebuilds preserve formatting
        run: mise run format:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-verification
          path: |
            build/sdk-verification/
            build/cartridge-verification/
            build/resource-verification/
            build/graphics-verification/
            build/compact-3d/
            build/audio-verification/
            build/synthesis-verification/
            build/profile-verification/
            build/odin-player/verification/
