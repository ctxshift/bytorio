name: Build and verify players

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Emscripten
        shell: pwsh
        run: |
          git clone https://github.com/emscripten-core/emsdk.git .tools/emsdk
          git -C .tools/emsdk checkout 3b3963d86a5c97adaf6eaa845cdfe0b811c2f960
          ./.tools/emsdk/emsdk.bat install 6.0.12
          ./.tools/emsdk/emsdk.bat activate 6.0.12
      - name: Install browser verifier
        run: npm ci
      - name: Verify both SDKs and project tools
        env:
          PLAYER_BROWSER_CHANNEL: chrome
        run: npm run test:sdk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-verification
          path: build/sdk-verification/

  odin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build pinned Odin native and browser players
        shell: pwsh
        run: ./tools/build-odin.ps1 all -Fixtures
      - name: Install browser verifier
        run: |
          npm ci
          npx playwright install chromium
      - name: Verify Odin reproduction and recovery
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: npm run test:odin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odin-verification
          path: build/odin-player/verification/

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native player and core tests
        shell: pwsh
        run: ./tools/build.ps1 native
      - name: Verify VM contracts
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Run native smoke scenario
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          New-Item -ItemType Directory -Force build/verification | Out-Null
          ./build/native/Release/player.exe --smoke --capture build/verification/native.bmp > build/verification/native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: native-verification
          path: build/verification/

  browser:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git .tools/emsdk
          git -C .tools/emsdk checkout 3b3963d86a5c97adaf6eaa845cdfe0b811c2f960
          ./.tools/emsdk/emsdk install 6.0.12
          ./.tools/emsdk/emsdk activate 6.0.12
      - name: Build browser player
        run: |
          ./.tools/emsdk/upstream/emscripten/emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/web --target player -j 4
      - uses: actions/download-artifact@v4
        with:
          name: native-verification
          path: build/verification/
      - name: Install browser verifier
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify browser and compare with native
        env:
          PLAYER_NATIVE_REPORT: build/verification/native.json
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: build/verification/
