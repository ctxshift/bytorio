name: Build and verify Bytorio

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run format:js:check

  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            validation: --full
            tools: ""
          - runner: macos-15
            platform: macos-arm64
            validation: --full
            tools: ""
          - runner: macos-15-intel
            platform: macos-x64
            validation: test:cli
            tools: node bun github:DanielGavin/ols stylua
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PLAYER_BROWSER_CHANNEL: chrome
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.15
          install_args: ${{ matrix.tools }}
      - run: npm ci
      - name: Run quality, conformance, drawing and cache gates
        run: mise run validate ${{ matrix.validation }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-verification-${{ matrix.platform }}
          path: |
            build/validation/
            build/sdk-verification/
            build/cartridge-verification/
            build/resource-verification/
            build/graphics-verification/
            build/compact-3d/
            build/audio-verification/
            build/synthesis-verification/
            build/profile-verification/
            build/odin-player/verification/
