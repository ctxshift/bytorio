name: Verify published CLI installation

on:
  push:
    paths:
      - "install/**"
      - "tools/verify-cli-install.mjs"
      - "tools/host-platform.mjs"
      - "tools/release-config.mjs"
      - "mise.toml"
      - "docs/getting-started.md"
      - "docs/mise-installation.md"
      - ".github/workflows/cli-install.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "install/**"
      - "tools/verify-cli-install.mjs"
      - "tools/host-platform.mjs"
      - "tools/release-config.mjs"
      - "mise.toml"
      - "docs/getting-started.md"
      - "docs/mise-installation.md"
      - ".github/workflows/cli-install.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version or byt-v tag; latest includes previews"
        default: latest
        type: string
  workflow_call:
    inputs:
      version:
        default: latest
        type: string

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      BYTORIO_CLI_VERSION: ${{ inputs.version || 'latest' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.8
          install_args: node
      - name: Verify the consumer installation workflow
        run: mise run test:cli-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-install-${{ matrix.runner }}
          path: build/cli-install-verification/
