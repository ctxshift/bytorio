min_version = "2026.10.8"

[env]
MISE_BIN = "{{ mise_bin }}"
_.path = ["{{ mise_bin | dirname }}"]

[tool_alias]
clang-format = "github:cpp-linter/clang-tools-static-binaries"
clang-tidy = "github:cpp-linter/clang-tools-static-binaries"

[tools]
"github:DanielGavin/ols" = {version = "dev-2026-10", rename_exe = {"ols-*" = "ols", "odinfmt-*" = "odinfmt"}}
luau = "0.743"
node = "24.19.0"
odin = {version = "dev-2026-10", strip_components = 1, bin_path = "."}
stylua = "2.6.0"
# Used only by the upstream Emscripten SDK, not by project scripts.
clang-format = {version = "llvm-23.1.3", matching = "clang-format-23_", bin = "clang-format", format = "raw"}
clang-tidy = {version = "llvm-23.1.3", matching = "clang-tidy-23_", bin = "clang-tidy", format = "raw"}
cmake = "4.3.3"
"github:bytecodealliance/wasmtime" = {version = "49.0.3", asset_pattern = "wasmtime-v49.0.3-x86_64-windows-c-api.zip", os = ["windows"]}
"github:ctxshift/bees" = "0.4.0"
ninja = "1.13.1"
python = "3.13.3"
"vfox:jdx/vfox-emsdk" = {version = "6.0.12", depends = ["python"]}

[task_config]
includes = [".mise/tasks/*.toml"]

[tasks.format]
description = "Format JavaScript, Odin, Luau and C++"
run = ["npm run format:js", "node tools/format-code.mjs"]

[tasks."format:check"]
description = "Check formatting in every project language"
run = ["npm run format:js:check", "node tools/format-code.mjs --check"]

[tasks.generate]
description = "Generate shared console and resource constants"
run = "node tools/generate-constants.mjs"

[tasks.byt]
description = "Run the Bytorio developer CLI"
run = "node tools/byt.mjs"

[tasks."generate:check"]
description = "Check generated constants against their contracts"
run = "node tools/generate-constants.mjs --check"

[tasks.lint]
depends = ["generate:check"]
description = "Lint JavaScript, Odin, Luau and C++"
run = ["npm run lint:js", "node tools/lint-code.mjs odin", "node tools/lint-code.mjs luau", "node tools/lint-code.mjs cpp"]

[tasks."lint:cpp"]
description = "Run clang-tidy on the Luau C++ bridge for its Wasm target"
run = "node tools/lint-code.mjs cpp"

[tasks."format:cpp"]
description = "Format all project C++ sources and headers"
run = "node tools/format-code.mjs cpp"

[tasks."build:odin"]
description = "Build standalone native/browser players and fixtures"
outputs = [
  "build/odin-player/native/player.exe",
  "build/odin-player/native/wasmtime.dll",
  "build/odin-player/native/SDL3.dll",
  "build/odin-player/web/runtime.wasm",
  "build/odin-player/web/runtime-gpu.wasm",
  "build/odin-player/web/gpu.js",
  "build/odin-player/web/gpu-surface.js",
  "build/odin-player/web/gpu-shaders/fullscreen.vert",
  "build/odin-player/web/gpu-shaders/initialize.frag",
  "build/odin-player/web/gpu-shaders/mesh.vert",
  "build/odin-player/web/gpu-shaders/mesh.frag",
  "build/odin-player/web/gpu-shaders/resolve.frag",
  "build/odin-player/web/gpu-shaders/resident.vert",
  "build/odin-player/web/gpu-shaders/present.frag",
  "build/odin-player/web/audio.wasm",
  "build/odin-player/web/player.html",
  "build/odin-player/web/player.js",
  "build/odin-player/web/worker.js",
  "build/odin-player/web/policy.js",
  "build/odin-player/web/audio-worklet.js",
  "build/odin-player/web/constants.js",
  "build/odin-player/web/cartridge.js",
  "build/odin-player/web/executor-cache.js",
  "build/odin-player/web/executor-cache-core.js",
  "build/odin-player/web/frame-clock.js",
  "build/odin-player/web/licenses/odin.txt",
  "build/odin-player/native/licenses/odin.txt",
  "build/odin-player/native/licenses/sdl3.txt",
  "build/odin-player/native/licenses/wasmtime.txt",
  "build/odin-player/native/game.wasm",
  "build/odin-player/web/game.wasm",
  "build/odin-player/web/fixtures/loop.wasm",
  "build/odin-player/web/fixtures/abi.wasm",
  "build/odin-player/web/fixtures/offset.wasm",
  "build/odin-player/web/fixtures/command.wasm",
  "build/odin-player/web/fixtures/trap.wasm",
  "build/odin-player/web/fixtures/list-count.wasm",
  "build/odin-player/web/fixtures/list-offset.wasm",
  "build/odin-player/web/fixtures/list-command.wasm",
]
run = "node tools/build-odin.mjs --fixtures"
sources = [
  "runtime/odin/**/*",
  "sdk/odin/**/*.odin",
  "examples/hello-odin/**/*.odin",
  "tests/odin/fixtures/**/*.odin",
  "tools/build-odin.mjs",
  "tools/player-export.mjs",
  "tools/toolchain.mjs",
  "tools/command-timing.mjs",
  "mise.toml",
]

[tasks."build:rpg"]
depends = ["deps:luau"]
description = "Build and package both RPG cartridges"
run = ["node tools/build-odin.mjs --game rpg --fixtures", "node experiments/luau-executor/stage.mjs"]

[tasks."build:racing"]
depends = ["deps:luau"]
description = "Build and package both racing cartridges"
run = [
  "node tools/build-odin.mjs --game racing",
  "node experiments/luau-executor/stage.mjs build/racing-player racing",
]

[tasks."test:sdk"]
run = ["node tools/verify-sdk.mjs", "node tools/verify-sdk-cli.mjs"]

[tasks."test:cartridge"]
run = "node tools/verify-cartridge.mjs"

[tasks."test:resources"]
run = "node tools/verify-resources.mjs"

[tasks."test:audio"]
description = "Verify low-level PCM APIs, mixer and native/browser delivery"
run = "node tools/verify-audio.mjs"

[tasks."test:synthesis"]
description = "Verify synthesis, effects and the full DSP workload on native/browser"
run = ["node tools/verify-audio.mjs --synthesis", "node tools/verify-audio.mjs --synthesis --stress"]

[tasks."build:resource-examples"]
description = "Build playable graphics and synthesis PNGs for both SDKs and hosts"
run = "node tools/build-resource-profile.mjs"

[tasks."test:profile"]
description = "Verify published profile negotiation, packaging and lifecycle on both hosts"
run = "node tools/verify-profile.mjs"

[tasks."test:graphics"]
run = "node tools/verify-graphics.mjs"

[tasks."build:3d"]
description = "Build both experimental mesh and voxel cartridges for native/browser"
run = "node tools/build-3d.mjs"

[tasks."build:billboards"]
description = "Build both SDK billboard and cutout gardens for native/browser"
run = "node tools/build-billboards.mjs"

[tasks."serve:billboards"]
description = "Serve the built billboard garden comparison"
run = "node tools/serve.mjs build/billboards"

[tasks."build:voxel-resolution"]
description = "Render both voxel scenes at three output resolutions"
run = ["node experiments/voxel-resolution/render.mjs", "node experiments/voxel-resolution/river.mjs"]

[tasks."serve:voxel-resolution"]
depends = ["build:voxel-resolution"]
description = "Serve the generated voxel resolution comparison"
run = "node tools/serve.mjs build/compact-3d/resolution"

[tasks."test:voxel-resolution"]
depends = ["build:voxel-resolution"]
description = "Verify live supersampling, native dimensions and rabbit/camera controls"
run = [
  "node experiments/voxel-resolution/verify-river.mjs",
  "node experiments/voxel-resolution/verify-stability.mjs",
  "node experiments/voxel-resolution/verify-presentation.mjs",
]

[tasks."bench:voxel-resolution"]
depends = ["build:voxel-resolution"]
description = "Measure riverside CPU, GPU and frame pacing on installed Chrome"
run = "node experiments/voxel-resolution/benchmark.mjs"

[tasks."build:riverside"]
depends = ["build:odin", "build:voxel-resolution"]
description = "Package the full riverside surface field through both SDKs"
run = "node experiments/voxel-resolution/console-build.mjs"

[tasks."bench:riverside"]
depends = ["build:riverside"]
description = "Verify and measure the full riverside cartridges on native and browser GPU hosts"
run = "node experiments/voxel-resolution/console-benchmark.mjs"

[tasks."test:riverside:geometry"]
description = "Check riverside face coverage, encoding and bounded compression"
run = "node --test experiments/voxel-resolution/console-mesh.test.mjs tools/gpu-surface.test.mjs"

[tasks."test:riverside:surface"]
depends = ["build:riverside"]
description = "Verify whole-scene surface samples on native and browser GPU hosts"
run = "node experiments/voxel-resolution/verify-console-surface.mjs"

[tasks."bench:riverside:cpu"]
depends = ["build:riverside"]
description = "Measure interactive CPU quality modes and final canvas delivery"
run = "node experiments/voxel-resolution/console-cpu-benchmark.mjs"

[tasks."bench:riverside:startup"]
depends = ["build:riverside"]
description = "Measure cartridge sizes and first complete scene on native and browser"
run = "node experiments/voxel-resolution/console-startup-benchmark.mjs"

[tasks."test:riverside:controls"]
depends = ["build:riverside"]
description = "Verify riverside controls and counters in both SDKs and exact CPU host replays"
run = "node experiments/voxel-resolution/verify-console-controls.mjs"

[tasks."test:gpu"]
depends = ["build:3d"]
description = "Verify transactional GPU rasterization, both SDKs and native/browser quality settings"
run = "node tools/verify-gpu.mjs"

[tasks."test:3d"]
description = "Verify and benchmark shared mesh/voxel rendering through both SDKs and hosts"
run = "node tools/verify-3d.mjs"

[tasks."test:textured3d"]
description = "Verify typed textured resources through both SDKs and native/browser hosts"
run = "node tools/verify-textured-3d.mjs"

[tasks."test:textured3d:gpu"]
description = "Qualify optional textured GPU execution, residency and quality on native/browser hosts"
run = "node tools/verify-textured-gpu.mjs"

[tasks."test:billboards"]
description = "Verify billboard transforms, cutout holes and native/browser CPU parity in both SDKs"
run = "node tools/verify-billboards.mjs"

[tasks."test:billboards:gpu"]
description = "Qualify optional GPU cutout and billboard rendering in both SDKs"
run = "node tools/verify-billboards.mjs --gpu"

[tasks."test:odin"]
depends = ["build:odin"]
env = {SDL_VIDEODRIVER = "dummy", SDL_AUDIODRIVER = "dummy", SDL_RENDER_DRIVER = "software"}
run = "node tools/verify-odin.mjs"

[tasks."test:display"]
depends = ["build:rpg"]
run = "node tools/verify-display.mjs"

[tasks."test:rpg"]
depends = ["build:rpg"]
run = "node experiments/luau-executor/benchmark.mjs --verify"

[tasks."test:racing"]
depends = ["build:racing"]
run = "node tools/verify-racing.mjs"

[tasks.test]
description = "Run the conformance suites sequentially"
run = [
  {task = "test:validation"},
  {task = "test:player-export"},
  {task = "test:sdk"},
  {task = "test:cartridge"},
  {task = "test:resources"},
  {task = "test:graphics"},
  {task = "test:3d"},
  {task = "test:textured3d"},
  {task = "test:billboards"},
  {task = "test:riverside:geometry"},
  {task = "test:audio"},
  {task = "test:synthesis"},
  {task = "test:profile"},
  {task = "test:odin"},
  {task = "test:display"},
  {task = "test:rpg"},
  {task = "test:racing"},
]

[tasks.validate]
description = "Run validation with retained logs and source fingerprints"
run = "node tools/validate.mjs"

[tasks."test:validation"]
description = "Test validation failure reporting, deadlines and source tracking"
run = "node --test tools/validation-runner.test.mjs tools/frame-clock.test.mjs"

[tasks."test:player-export"]
description = "Verify complete player exports and missing-dependency failures"
run = "node --test tools/player-export.test.mjs"

[tasks."test:drawing"]
run = "node experiments/luau-executor/verify-drawing.mjs"

[tasks."test:cache"]
run = "node experiments/luau-executor/verify-cache.mjs"
